<html lang="en">

<head>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>
    <header>
        <h1>Guilherme Enrico Barichello</h1>
    </header>
    <section id="contato">
        <div class="cards">
            <div class="container-projetos">
                <div class="sina">
                    <p><a href="https://github.com/Gengiscana"><img src="github.png" width="120px" height="auto"></a>
                    </p>
                </div>
                <div class="sina">
                    <p><a href="https://www.instagram.com/gincana_barichello/"><img src="instagram.png" width="150px" height="auto"></a></p>
                </div>
                <div class="discord-card">
                    <p class="discord-texto" style="color: rgb(0, 0, 0); font-size: larger;">gincana</p>
                    <img src="discord.png" style="border-radius: 360px; height: 120px; width: auto;">
                </div>
                <div class="discord-card">
                    <p class="discord-texto" style="font-family: Arial, Helvetica, sans-serif; color: rgb(0, 0, 0);">guibarrichello63@gmail.com</p>
                    <img src="gmail.png" style="border-radius: 360px; height: 120px; width: auto;">
                </div>
            </div>
        </div>
    </section>
    <a href="index.html">
        <div class="cards">
            <div class="card-retorno">
                <p>Retorne</p>
            </div>
        </div>
    </a>
    <div id="loader-overlay" class="loader-overlay">
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
    </div>

    <script>
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const destino = link.getAttribute('href');

                document.getElementById('loader-overlay').classList.add('ativo');

                setTimeout(() => {
                    window.location.href = destino;
                }, 1200);
            });
        });
    </script>
</body>

</html>
