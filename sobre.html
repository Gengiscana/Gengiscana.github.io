<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <header>
        <h1>Guilherme Enrico Barichello</h1>
    </header>
    <section style="margin: 200px;">
        <div class="container">
            <div class="sobre-mim">
                <img src="aura.webp" class="foto-perfil">
                <div class="sobre-informacoes">
                    <h2>Sobre Mim</h2>
                    <p style="font-size: larger;">Turma de Desenvolvimento de Sistemas - 2° Semestre - SESI</p>
                </div>
            </div>
        </div>
    </section>
    <a href="index.html">
        <div class="cards">
            <div class="card-retorno">
                <p>Retorne</p>
            </div>
        </div>
    </a>
    <div id="loader-overlay" class="loader-overlay">
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
    </div>

    <script>
        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const destino = link.getAttribute('href');

                document.getElementById('loader-overlay').classList.add('ativo');

                setTimeout(() => {
                    window.location.href = destino;
                }, 1200);
            });
        });
    </script>
</body>
</html>
