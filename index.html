<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>
    <header>
        <h1>
            <center>Guilherme Enrico Barichello</center>
        </h1>
    </header>
    <div class="menu-opcoes">
        <div class="opcao-item">
            <br><br><br><br><br>
            <p><a href="sobre.html"><img src="opcao.png"><span>Sobre Mim</span></a></p>
        </div>
        <div class="opcao-item">
            <br><br><br><br><br>
            <p><a href="formacao.html"><img src="opcao.png"><span>Formação</span></a></p>
        </div>
        <div class="opcao-item">
            <br><br><br><br><br>
            <p><a href="projetos.html"><img src="opcao.png"><span>Projetos</span></a></p>
        </div>
        <div class="opcao-item">
            <br><br><br><br><br>
            <p><a href="hobby.html"><img src="opcao.png"><span>Hobbies</span></a></p>
        </div>
        <div class="opcao-item">
            <br><br><br><br><br>
            <p><a href="conquistas.html"><img src="opcao.png"><span>Conquistas</span></a></p>
        </div>
        <div class="opcao-item">
            <br><br><br><br><br>
            <p><a href="contato.html"><img src="opcao.png"><span>Contatos</span></a></p>
        </div>
    </div>
    <!-- Transição veio do Uiverse.io by Shoh2008 (modificada) -->
    <div id="loader-overlay" class="loader-overlay">
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
    </div>

    <script>
        document.querySelectorAll('.opcao-item a').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const destino = link.getAttribute('href');

                document.getElementById('loader-overlay').classList.add('ativo');

                setTimeout(() => {
                    window.location.href = destino;
                }, 1200);
            });
        });
    </script>
</body>

</html>
